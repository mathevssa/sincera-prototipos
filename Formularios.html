.toast p{margin:2px 0 0;font-size:var(--text-sm);line-height:16px;color:var(--white-60)}

@media (max-width:1180px){
  .builder{grid-template-columns:200px minmax(0,1fr)}
  .inspector{grid-column:1 / -1;position:static}
}
@media (max-width:900px){
  .side{display:none}
  .main{margin-left:0}
  .page{padding:var(--space-5) var(--space-4) var(--space-12)}
}

// ponytail: o hash é a única fonte do estado inicial — nada de localStorage,

function doHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  return ESTADOS[h] ? h : '';
}

function hashDaView() {
  if (S.view === 'construtor') return 'construir-perguntas';
  if (S.view === 'respostas') return formAtivo() && formAtivo().anonimo ? 'acompanhar-respostas-anonimo' : 'acompanhar-respostas';
  const a = ABAS.find((x) => x.view === S.view);
  return a ? a.hash : ABAS[0].hash;
}

function escreverHash(id) {
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// sem history */ }
}

/* aplica um estado do Atlas por id e sincroniza o hash */
function irParaEstado(id) {
  const e = ESTADOS[id];
  if (!e) return;
  S.modal = null; S.form = {}; S.sel = null; S.respondente = null;
  S.view = e.view;
  if (e.aplica) e.aplica(S);
  escreverHash(id);
  render();
}

function abrirModal(nome, form, hashId) {
  S.modal = nome; S.form = form || {};
  escreverHash(hashId || hashDaView());
  render();
}

function fecharModal() {
  S.modal = null; S.form = {}; S.respondente = null;
  escreverHash(hashDaView());
  render();
}

function irParaView(view, alvo) {
  S.view = view; S.modal = null; S.form = {}; S.respondente = null;
  if (alvo) S.alvo = alvo;
  if (view === 'construtor' && !S.sel) S.sel = null;
  escreverHash(hashDaView());
  render();
}

const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qs = (sel, raiz) => (raiz || document).querySelector(sel);
const formAtivo = () => S.formularios.find((f) => f.id === S.alvo) || null;
const perguntasDe = (fid) => (S.perguntas[fid] = S.perguntas[fid] || []);
const catNome = (id) => (S.categorias.find((c) => c.id === id) || {}).nome || '—';
const pastaNome = (id) => (S.pastas.find((p) => p.id === id) || {}).nome || 'Sem pasta';
const pessoa = (id) => PESSOAS.find((p) => p.id === id) || { nome: '—', area: '', unidade: '' };
const grupo = (id) => GRUPOS.find((g) => g.id === id) || { nome: '—', membros: 0 };
const novoId = (p) => p + '-' + Math.random().toString(36).slice(2, 7);

const STATUS = {
  rascunho: { label: 'Rascunho', tone: 'neutral', icon: 'pencil' },
  publicado: { label: 'Publicado', tone: 'success', icon: 'send' },

  despublicado: { label: 'Despublicado', tone: 'danger', icon: 'eye-off' },
};

function alvoNomes(f) {
  return (f.publico || []).map((id) => (id[0] === 'g' ? grupo(id).nome : pessoa(id).nome));
}
function usosDaCategoria(cid) { return S.formularios.filter((f) => f.categoria === cid).length; }
function formsDaPasta(pid) { return S.formularios.filter((f) => f.pasta === pid).length; }

function notificar(titulo, texto, icon) {
  S.toast = { titulo: titulo, texto: texto, icon: icon || 'check' };
  clearTimeout(notificar._t);
  notificar._t = setTimeout(() => { S.toast = null; render(); }, 4200);
}

/* salvamento automático: 5s depois que o admin para de editar (regra compartilhada) */
function marcarEdicao() {
  S.salvando = true;
  clearTimeout(marcarEdicao._t);
  marcarEdicao._t = setTimeout(() => {
    S.salvando = false;
    S.salvo = new Date();
    render();
  }, 5000);
}

function botao(label, act, variante, opts) {

function switchBtn(on, act, opts) {

/* ===========================================================================
   Resumo · Painel Geral · Ajustes
   =========================================================================== */
function viewResumo() {
  const fs = S.formularios;
  const publicados = fs.filter((f) => f.status === 'publicado');
  const noAr = fs.filter((f) => f.status === 'publicado' || f.status === 'vencido');
  const rascunhos = fs.filter((f) => f.status === 'rascunho');
  const respostas = fs.reduce((a, f) => a + f.respostas, 0);
  const pendentes = noAr.reduce((a, f) => a + Math.max(0, f.publicoTotal - f.respostas), 0);

  const stats = [
    { label: 'Formulários', valor: fs.length, icon: 'layout-grid', tone: 'brand' },
    { label: 'Publicados', valor: publicados.length, icon: 'send', tone: 'success' },
    { label: 'Rascunhos', valor: rascunhos.length, icon: 'pencil', tone: 'neutral' },
    { label: 'Respostas recebidas', valor: respostas, icon: 'checklist', tone: 'info' },
    { label: 'Aguardando resposta', valor: pendentes, icon: 'clock', tone: 'warning' },
  ];

  const porCategoria = S.categorias.map((c) => ({ nome: c.nome, n: usosDaCategoria(c.id) }))
    .sort((a, b) => b.n - a.n);
  const maxCat = Math.max.apply(null, porCategoria.map((c) => c.n).concat([1]));

  const vencido = fs.find((f) => f.status === 'vencido');
  const maisPendente = noAr.slice().sort((a, b) => (b.publicoTotal - b.respostas) - (a.publicoTotal - a.respostas))[0];
  const anonimo = fs.find((f) => f.anonimo && f.status === 'publicado');

  const alertas = [
    vencido ? { tone: 'warning', icon: 'clock', titulo: vencido.titulo + ' venceu em ' + vencido.fim,
      texto: 'Vencido é sinalização interna: o formulário continua no Portal e continua aceitando respostas. Para tirar do ar, despublique.', id: vencido.id } : null,
    maisPendente ? { tone: 'info', icon: 'users', titulo: (maisPendente.publicoTotal - maisPendente.respostas) + ' pessoas ainda não responderam ' + maisPendente.titulo,
      texto: 'Lembrete automático ligado: reenvia a cada 7 dias para quem não respondeu, até despublicar.', id: maisPendente.id } : null,
    rascunhos.length ? { tone: 'neutral', icon: 'pencil', titulo: rascunhos.length + ' rascunhos nunca publicados',
      texto: rascunhos.map((r) => r.titulo).join(' · '), id: rascunhos[0].id } : null,
    anonimo ? { tone: 'info', icon: 'lock', titulo: anonimo.titulo + ' é anônimo',
      texto: 'Não existe lista de pendentes: sem identidade, o painel mostra só percentual e resultados agrupados.', id: anonimo.id } : null,
  ].filter(Boolean);

  return cabecalhoModulo() +
  '<div class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr));margin-top:var(--space-5)">' +
    stats.map((s) => '<div class="stat"><i class="badge b-' + s.tone + ' nodot" style="border-radius:var(--radius-sm)">' + ic(s.icon, 18) + '</i>' +
      '<div><b>' + s.valor + '</b><span>' + esc(s.label) + '</span></div></div>').join('') +
  '</div>' +
  '<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);margin-top:var(--space-4)">' +
    '<section class="card">' +
      '<div class="card-head"><h2 class="sec">Distribuição por categoria</h2>' +
        '<button class="btn btn-ghost sm" data-act="aba" data-v="ajustes">' + ic('tag', 15) + 'Gerenciar</button></div>' +
      '<div class="card-body col" style="gap:var(--space-4)">' +
        porCategoria.map((c) => '<div class="col" style="gap:6px">' +
          '<div class="row"><span style="flex:1;font-size:var(--text-13);font-weight:500">' + esc(c.nome) + '</span>' +
          '<span class="sub">' + c.n + (c.n === 1 ? ' formulário' : ' formulários') + '</span></div>' +
          '<div class="bar"><span style="width:' + Math.round((c.n / maxCat) * 100) + '%"></span></div></div>').join('') +
      '</div>' +
      '<div class="card-foot sub">A categoria é obrigatória no formulário e alimenta a busca do Painel Geral. Categoria em uso não pode ser excluída.</div>' +
    '</section>' +
    '<section class="card">' +
      '<div class="card-head"><h2 class="sec">Alertas e pendências</h2></div>' +
      '<div class="card-body col" style="gap:10px">' +
        alertas.map((a) => '<button class="alert a-' + a.tone + '" data-act="abrir-form" data-id="' + a.id + '" style="width:100%;text-align:left;cursor:pointer">' +
          ic(a.icon, 18) + '<div><b>' + esc(a.titulo) + '</b><p>' + esc(a.texto) + '</p></div></button>').join('') +
      '</div>' +
    '</section>' +
  '</div>' +
  '<section class="card" style="margin-top:var(--space-4)">' +
    '<div class="card-head"><h2 class="sec">Atividades recentes</h2><span class="sub">Registro completo em Auditoria</span></div>' +
    '<div class="card-body col" style="gap:var(--space-4)">' +
      S.atividades.map((a) => '<div class="row" style="align-items:flex-start">' +
        '<span class="badge b-' + a.tone + ' nodot" style="width:28px;height:28px;justify-content:center;border-radius:var(--radius-sm)">' + ic(a.icon, 15) + '</span>' +
        '<div style="flex:1;min-width:0"><div style="font-size:var(--text-13);line-height:18px">' + esc(a.texto) + '</div>' +
        '<div class="sub">' + esc(a.quem) + ' · ' + esc(a.quando) + '</div></div></div>').join('') +
    '</div>' +
  '</section>';
}

/* ---------- Painel Geral ---------- */
function filtrados() {
  const b = S.busca.trim().toLowerCase();
  return S.formularios.filter((f) => {
    if (S.rail === 'sem-pasta' && f.pasta) return false;
    if (S.rail !== 'todas' && S.rail !== 'sem-pasta' && S.rail !== 'lixeira' && f.pasta !== S.rail) return false;
    if (S.status !== 'todos' && f.status !== S.status) return false;
    if (b && (f.titulo + ' ' + f.codigo + ' ' + catNome(f.categoria)).toLowerCase().indexOf(b) < 0) return false;
    return true;
  });
}

function acoesDaLinha(f) {
  const out = [];
  if (f.status !== 'rascunho') out.push(ibtn('chart-bar', 'respostas', 'Acompanhar respostas', { id: f.id }));
  out.push(ibtn('pencil', 'abrir-form', 'Editar perguntas', { id: f.id }));
  if (f.status === 'rascunho') out.push(ibtn('send', 'publicar', 'Publicar', { id: f.id }));
  else if (f.status === 'despublicado') out.push(ibtn('send', 'publicar', 'Republicar', { id: f.id }));
  else out.push(ibtn('eye-off', 'despublicar', 'Despublicar', { id: f.id }));
  out.push(ibtn('copy', 'duplicar-form', 'Duplicar', { id: f.id }));
  out.push(ibtn('trash', 'excluir-form', 'Excluir', { id: f.id, danger: true }));
  return out.join('');
}

      '<span class="sub">' + esc(p.descricao) + '</span>' +
      '<div class="col" style="gap:6px"><span class="caps">Quem tem acesso</span>' +
        '<div class="row" style="flex-wrap:wrap;gap:6px">' + p.acesso.map((id) => '<span class="chip">' + ic('user', 14) + esc(pessoa(id).nome) + '</span>').join('') + '</div></div>' +
      (n ? alerta('warning', 'Pasta com ' + n + (n === 1 ? ' formulário' : ' formulários'),
        'Pasta com formulário dentro não pode ser excluída — esvazie primeiro. Diferente do formulário, que vai para a Lixeira, aqui a ação é barrada.', 'alert-triangle')
        : '<div class="row">' + botao('Excluir pasta', 'excluir-pasta', 'btn-ghost', { id: p.id, sm: true, icon: 'trash' }) + '</div>') +
    '</div></section>';
}

/* ---------- Ajustes (categorias) ---------- */
function viewAjustes() {
  return cabecalhoModulo() +
  '<div class="grid" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);margin-top:var(--space-5);align-items:start">' +
    '<section class="card">' +
      '<div class="card-head"><div><h2 class="sec">Categorias</h2><span class="sub">Classificam o formulário e alimentam a busca e o Resumo.</span></div>' +
        botao('Nova categoria', 'nova-categoria', 'btn-primary', { sm: true, icon: 'plus' }) + '</div>' +
      '<table class="tbl"><thead><tr><th>Categoria</th><th>Em uso</th><th class="acoes">Ações</th></tr></thead><tbody>' +
      S.categorias.map((c) => {
        const n = usosDaCategoria(c.id);
        return '<tr><td><div class="nome">' + esc(c.nome) + '</div><div class="sub">' + esc(c.descricao) + '</div></td>' +
          '<td>' + (n ? badge(n + (n === 1 ? ' formulário' : ' formulários'), 'brand') : '<span class="muted">Nenhum</span>') + '</td>' +
          '<td class="acoes">' + ibtn('pencil', 'editar-categoria', 'Editar', { id: c.id }) +
          ibtn('trash', 'excluir-categoria', n ? 'Categoria em uso — não pode ser excluída' : 'Excluir', { id: c.id, danger: true }) + '</td></tr>';
      }).join('') + '</tbody></table>' +
    '</section>' +
    '<section class="card">' +
      '<div class="card-head"><h2 class="sec">Como a categoria se comporta</h2></div>' +
      '<div class="card-body col" style="gap:var(--space-4)">' +
        condicoes([
          { icon: 'circle-check', cor: 'var(--magenta)', titulo: 'Obrigatória no formulário', detalhe: 'Todo formulário nasce com uma categoria — por isso não existe formulário sem categoria.' },
          { icon: 'search', titulo: 'Alimenta a busca', detalhe: 'A busca do Painel Geral encontra por nome, código ou categoria.' },
          { icon: 'chart-bar', titulo: 'Alimenta o Resumo', detalhe: 'A distribuição por categoria do Resumo vem desta lista.' },
          { icon: 'ban', cor: 'var(--danger)', titulo: 'Exclusão barrada quando está em uso', detalhe: 'Para excluir, troque antes a categoria de todos os formulários que a usam. A ação é barrada, não adiada — nada vai para a Lixeira.' },
        ]) +
      '</div>' +
      '<div class="card-foot sub">Acesso ao módulo por leitor e editor ainda não está documentado no Atlas — o acesso por pasta é binário e adicional a ele.</div>' +
    '</section>' +
  '</div>';
}

/* ===========================================================================
   Construtor de perguntas · Acompanhar respostas
   =========================================================================== */
function cabecalhoFormulario(f, aba) {
  const st = STATUS[f.status];
  return '' +
  '<div class="row" style="align-items:flex-start;gap:var(--space-4)">' +
    '<button class="ibtn" data-act="voltar" title="Voltar ao Painel Geral" aria-label="Voltar">' + ic('arrow-left', 18) + '</button>' +
    '<div style="flex:1;min-width:0">' +
      '<span class="eyebrow">Formulários · ' + esc(catNome(f.categoria)) + '</span>' +
      '<h1 class="title">' + esc(f.titulo) + '</h1>' +
      '<div class="row" style="margin-top:6px;flex-wrap:wrap;gap:8px">' +
        badge(st.label, st.tone) +
        (f.anonimo ? badge('Resposta anônima', 'info') : badge('Identificado', 'neutral')) +
        (f.obrigatorio ? badge('Obrigatório', 'brand') : '') +
        '<span class="sub">' + esc(f.codigo) + (f.versao ? ' · ' + esc(f.versao) : '') + ' · ' + esc(pastaNome(f.pasta)) + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="row">' +
      (aba === 'construtor'
        ? botao(f.status === 'rascunho' ? 'Publicar' : 'Configurar publicação', 'publicar', 'btn-primary', { id: f.id, icon: 'send' })
        : botao('Editar perguntas', 'abrir-form', 'btn-neutral', { id: f.id, icon: 'pencil' })) +
      (f.status !== 'rascunho'
        ? (aba === 'construtor' ? botao('Ver respostas', 'respostas', 'btn-neutral', { id: f.id, icon: 'chart-bar' }) : '')
        : '') +
    '</div>' +
  '</div>';
}

function previaCampo(q) {
  const marca = (tipo) => '<i class="' + (tipo === 'r' ? 'r' : 's') + '"></i>';
  switch (q.tipo) {
    case 'texto-longo': return '<div class="fake" style="height:72px;align-items:flex-start;padding-top:10px">Resposta longa</div>';
    case 'selecao-unica': return (q.opcoes.length ? q.opcoes : ['Opção 1', 'Opção 2']).map((o) => '<span class="opt">' + marca('r') + esc(o) + '</span>').join('');
    case 'multipla': return (q.opcoes.length ? q.opcoes : ['Opção 1', 'Opção 2']).map((o) => '<span class="opt">' + marca('s') + esc(o) + '</span>').join('');
    case 'sim-nao': return ['Sim', 'Não'].map((o) => '<span class="opt">' + marca('r') + o + '</span>').join('');
    case 'data': return '<div class="fake">dd/mm/aaaa</div>';
    case 'intervalo': return '<div class="row" style="gap:8px"><div class="fake" style="flex:1">Início</div><div class="fake" style="flex:1">Fim</div></div>';
    case 'upload': return '<div class="fake" style="height:64px;justify-content:center;border-style:dashed">Arraste um arquivo ou clique para selecionar</div>';
    case 'numero': return '<div class="fake" style="max-width:180px">0</div>';
    case 'moeda': return '<div class="fake" style="max-width:180px">R$ 0,00</div>';
    case 'documento': return '<div class="fake" style="max-width:220px">000.000.000-00</div>';
    case 'declaracao': return '<span class="opt">' + marca('s') + 'Declaro que as informações são verdadeiras</span>';
    default: return '<div class="fake">Resposta curta</div>';
  }
}

function gatilhosDisponiveis(fid, ateId) {
  const lista = perguntasDe(fid);
  const i = lista.findIndex((q) => q.id === ateId);
  return lista.slice(0, i < 0 ? lista.length : i).filter((q) => tipoDe(q.tipo).gatilho);
}
function valoresDoGatilho(fid, gid) {
  const q = perguntasDe(fid).find((x) => x.id === gid);
  if (!q) return [];
  return q.tipo === 'sim-nao' ? ['Sim', 'Não'] : q.opcoes.slice();
}

function cardPergunta(q, i, fid) {
  const t = tipoDe(q.tipo);
  const gat = q.condicao ? perguntasDe(fid).find((x) => x.id === q.condicao.gatilho) : null;
  return '<div class="drop" data-drop="' + i + '"></div>' +
  '<article class="qcard' + (S.sel === q.id ? ' sel' : '') + '" data-act="sel-campo" data-id="' + q.id + '" draggable="true" data-drag-q="' + q.id + '">' +
    '<span class="grip">' + ic('grip-vertical', 16) + '</span>' +
    '<div style="padding-left:18px">' +
      '<div class="qhead">' +
        '<div class="qt">' +
          '<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:4px">' +
            '<span class="chip">' + ic(t.icon, 14) + esc(t.nome) + '</span>' +
            (q.obrigatorio ? badge('Obrigatório', 'brand', true) : '') +
            (gat ? '<span class="badge b-info nodot">' + ic('bolt', 13) + 'Só aparece se ' + esc((gat.titulo || '').slice(0, 28)) + '… = ' + esc(q.condicao.valor) + '</span>' : '') +
          '</div>' +
          '<b>' + esc(q.titulo) + (q.obrigatorio ? ' <span class="req">*</span>' : '') + '</b>' +
          (q.descricao ? '<p>' + esc(q.descricao) + '</p>' : '') +
        '</div>' +
        '<div class="row" style="gap:0">' +
          ibtn('copy', 'dup-campo', 'Duplicar campo', { id: q.id }) +
          ibtn('trash', 'del-campo', 'Excluir campo', { id: q.id, danger: true }) +
        '</div>' +
      '</div>' +
      '<div class="qprev">' + previaCampo(q) + '</div>' +
    '</div>' +
  '</article>';
}

function inspector(f) {
  const q = perguntasDe(f.id).find((x) => x.id === S.sel);
  if (!q) {
    return '<section class="card inspector"><div class="card-head"><h2 class="sec">Editar campo</h2></div>' +
      '<div class="card-body col" style="gap:10px">' +
      '<span class="sub">Clique num campo do formulário para editar título, descrição, obrigatoriedade, opções e lógica condicional. A pré-visualização ao lado acompanha em tempo real.</span>' +
      alerta('info', 'Salvamento automático', 'Salva 5 segundos depois que você para de editar. Em edição contínua, salva a cada 5 segundos. Não existe botão de salvar como único caminho.', 'device-floppy') +
      '</div></section>';
  }
  const t = tipoDe(q.tipo);
  const gats = gatilhosDisponiveis(f.id, q.id);
  const valores = q.condicao ? valoresDoGatilho(f.id, q.condicao.gatilho) : [];
  return '<section class="card inspector">' +
    '<div class="card-head"><h2 class="sec">Editar campo</h2><span class="chip">' + ic(t.icon, 14) + esc(t.nome) + '</span></div>' +
    '<div class="card-body col" style="gap:var(--space-4)">' +
      campo('Pergunta', '<textarea class="inp" data-act="q-edit" data-k="titulo" data-live="1" rows="2">' + esc(q.titulo) + '</textarea>', { req: true }) +
      campo('Descrição de apoio', '<input class="inp" data-act="q-edit" data-k="descricao" data-live="1" value="' + esc(q.descricao) + '" placeholder="Opcional">') +
      '<label class="row" style="justify-content:space-between"><span style="font-size:var(--text-13);font-weight:500">Resposta obrigatória</span>' +
        switchBtn(q.obrigatorio, 'q-obrigatorio', { label: 'Resposta obrigatória' }) + '</label>' +
      (t.opcoes ? '<div class="field"><label>Opções <span class="req">*</span></label>' +
        '<div class="col" style="gap:6px">' + q.opcoes.map((o, i) =>
          '<div class="row" style="gap:6px"><input class="inp" data-act="q-opcao" data-i="' + i + '" data-live="1" value="' + esc(o) + '">' +
          ibtn('x', 'del-opcao', 'Remover opção', { v: String(i) }) + '</div>').join('') + '</div>' +
        '<button class="btn btn-ghost sm" data-act="add-opcao" style="align-self:flex-start;margin-top:6px">' + ic('plus', 15) + 'Adicionar opção</button></div>' : '') +
      '<div class="logic">' +
        '<div class="row"><span class="caps" style="flex:1">Lógica condicional</span>' +
          switchBtn(!!q.condicao, 'q-condicao', { disabled: gats.length === 0, label: 'Lógica condicional' }) + '</div>' +
        (gats.length === 0
          ? '<span class="sub">Nenhum campo anterior pode servir de gatilho. Só Sim/Não e Seleção única controlam a exibição de outros campos.</span>'
          : (q.condicao
            ? '<div class="col" style="gap:8px">' +
                '<select class="inp" data-act="q-gatilho">' + gats.map((g) =>
                  '<option value="' + g.id + '"' + (q.condicao.gatilho === g.id ? ' selected' : '') + '>' + esc(g.titulo.slice(0, 60)) + '</option>').join('') + '</select>' +
                '<div class="row" style="gap:8px"><span class="sub" style="white-space:nowrap">responder</span>' +
                '<select class="inp" data-act="q-valor" style="flex:1">' + valores.map((v) =>
                  '<option value="' + esc(v) + '"' + (q.condicao.valor === v ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select></div>' +
                '<span class="sub">Uma condição por campo: 1 gatilho + 1 valor esperado. Sem E/OU na V1 — mas o mesmo gatilho pode controlar vários campos.</span>' +
              '</div>'
            : '<span class="sub">Desligada: o campo aparece sempre.</span>')) +
        (q.condicao && q.obrigatorio ? '<span class="sub" style="color:var(--warning-text)">' + 'Campo obrigatório escondido pela condição não bloqueia o envio — a obrigatoriedade só vale se ele chegou a aparecer.' + '</span>' : '') +
      '</div>' +
    '</div>' +
    '<div class="card-foot row" style="gap:8px">' +
      botao('Duplicar', 'dup-campo', 'btn-neutral', { id: q.id, sm: true, icon: 'copy' }) +
      botao('Excluir', 'del-campo', 'btn-ghost', { id: q.id, sm: true, icon: 'trash' }) +
    '</div>' +
  '</section>';
}

function viewConstrutor() {
  const f = formAtivo();
  if (!f) return viewPainel();
  const lista = perguntasDe(f.id);
  const salvo = S.salvando
    ? '<span class="chip">' + ic('clock', 14) + 'Alterações pendentes · salva em 5s</span>'
    : (S.salvo ? '<span class="chip">' + ic('device-floppy', 14) + 'Salvo automaticamente às ' +
        S.salvo.getHours() + ':' + String(S.salvo.getMinutes()).padStart(2, '0') + '</span>'
      : '<span class="chip">' + ic('device-floppy', 14) + 'Rascunho salvo automaticamente</span>');

  return cabecalhoFormulario(f, 'construtor') +
  '<div class="row" style="margin-top:var(--space-4);gap:8px;flex-wrap:wrap">' + salvo +
    '<span class="chip">' + ic('layout-grid', 14) + lista.length + ' campos</span>' +
    '<span class="chip">' + ic('bolt', 14) + lista.filter((q) => q.condicao).length + ' com lógica condicional</span>' +
    '<span class="grow" style="flex:1"></span>' +
    botao('Pré-visualizar', 'previa', 'btn-neutral', { sm: true, icon: 'eye' }) +
  '</div>' +
  '<div class="builder" style="margin-top:var(--space-4)">' +
    '<section class="card palette">' +
      '<div class="card-head"><h2 class="sec">Tipos de campo</h2></div>' +
      '<div class="card-body col" style="gap:6px;padding:var(--space-3)">' +
        TIPOS.map((t) => '<button class="ptype" draggable="true" data-drag-tipo="' + t.id + '" data-act="add-campo" data-v="' + t.id + '">' +
          ic(t.icon, 16) + '<span>' + esc(t.nome) + '</span></button>').join('') +
      '</div>' +
      '<div class="card-foot sub">Arraste para o formulário ou clique para adicionar ao fim. Os 12 tipos da V1.</div>' +
    '</section>' +
    '<div>' +
      '<div class="canvas" id="canvas">' +
        (lista.length ? lista.map((q, i) => cardPergunta(q, i, f.id)).join('') + '<div class="drop" data-drop="' + lista.length + '"></div>'
          : '<div class="card"><div class="empty">' + ic('layout-grid', 28, 'var(--ink-disabled)') +
            '<b>Formulário vazio</b><span class="sub">Arraste um tipo de campo da coluna à esquerda para começar.</span></div></div>' +
            '<div class="drop" data-drop="0"></div>') +
      '</div>' +
      '<p class="sub" style="margin-top:var(--space-3)">A lógica condicional vale em tempo real: na pré-visualização e na tela de resposta do Portal. Sem versionamento e sem painel de comentários — nenhum dos dois existe em Formulários.</p>' +
    '</div>' +
    inspector(f) +
  '</div>';
}

/* ---------- Acompanhar respostas ---------- */
function barrasDaPergunta(q) {
  const res = S.resultados[q.id];
  if (!res) {
    return '<div class="row" style="gap:8px"><span class="chip">' + ic('align-justify', 14) + 'Respostas em texto</span>' +
      '<span class="sub">Conteúdo aberto: leia na exportação em CSV ou PDF.</span></div>';
  }
  const total = Object.keys(res).reduce((a, k) => a + res[k], 0) || 1;
  return '<div class="col" style="gap:10px">' + Object.keys(res).map((k) => {
    const pct = Math.round((res[k] / total) * 100);
    return '<div class="col" style="gap:4px">' +
      '<div class="row"><span style="flex:1;font-size:var(--text-13)">' + esc(k) + '</span>' +
      '<span class="sub">' + res[k] + ' · ' + pct + '%</span></div>' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div></div>';
  }).join('') + '</div>';
}

function viewRespostas() {
  const f = formAtivo();
  if (!f) return viewPainel();
  const lista = perguntasDe(f.id);
  const pct = f.publicoTotal ? Math.round((f.respostas / f.publicoTotal) * 100) : 0;
  const respondeuIds = S.respondentes.map((r) => r.id);

  const cabecalhoPct =
  '<section class="card"><div class="card-body row" style="gap:var(--space-6);flex-wrap:wrap">' +
    '<div class="donut" style="--p:' + pct + '%"><span>' + pct + '%</span></div>' +
    '<div class="col" style="flex:1;min-width:220px;gap:6px">' +
      '<h2 class="sec">' + f.respostas + ' de ' + f.publicoTotal + ' respostas</h2>' +
      '<span class="sub">Percentual sobre o tamanho do público-alvo: ' + esc(alvoNomes(f).join(', ') || '—') + '.</span>' +
      (f.anonimo
        ? '<span class="sub">É contagem de envios sobre o público-alvo — não depende de saber quem é quem.</span>'
        : '<span class="sub">' + (f.publicoTotal - f.respostas) + ' pessoas ainda não responderam.</span>') +
    '</div>' +
    '<div class="col" style="gap:8px;min-width:200px">' +
      '<div class="row" style="gap:8px">' + ic('calendar', 16, 'var(--ink-muted)') + '<span class="sub">' +
        (f.inicio ? 'Início ' + esc(f.inicio) : 'Sem data de início') + ' · ' + (f.fim ? 'Fim ' + esc(f.fim) : 'Sem data final') + '</span></div>' +
      '<div class="row" style="gap:8px">' + ic(f.lembrete ? 'mail-forward' : 'mail', 16, 'var(--ink-muted)') +
        '<span class="sub">' + (f.lembrete ? 'Lembrete a cada 7 dias para quem não respondeu' : 'Sem lembrete automático') + '</span></div>' +
      '<div class="row" style="gap:8px">' + ic(f.anonimo ? 'lock' : 'user', 16, 'var(--ink-muted)') +
        '<span class="sub">' + (f.anonimo ? 'Resposta anônima — identidade substituída por ID' : 'Resposta identificada') + '</span></div>' +
    '</div>' +
  '</div></section>';

  const privacidade = f.anonimo
    ? '<section class="card" style="margin-top:var(--space-4)">' +
        '<div class="card-head"><h2 class="sec">Por que não existe tabela de respondentes</h2>' + badge('Resposta anônima', 'info') + '</div>' +
        '<div class="card-body col" style="gap:var(--space-4)">' +
          alerta('info', 'Não é rastreável, nem pelo admin',
            'A identidade de quem respondeu é substituída por um ID anonimizado. Nome, área e unidade não são guardados — nem exibidos de forma mascarada. Não há como reidentificar por cruzamento.', 'lock') +
          condicoes([
            { icon: 'percentage', titulo: 'Percentual continua funcionando', detalhe: 'Contagem de envios sobre o tamanho do público-alvo.' },
            { icon: 'chart-bar', titulo: 'Resultados agrupados por pergunta', detalhe: 'Tudo o que o admin vê sobre o conteúdo das respostas.' },
            { icon: 'ban', cor: 'var(--danger)', titulo: 'Sem status Pendente por pessoa', detalhe: 'Sem identidade não existe lista de quem falta — e por isso lembrete automático fica indisponível neste formulário.' },
          ]) +
        '</div></section>'
    : '';

  const tabela = f.anonimo ? '' :
    '<section class="card" style="margin-top:var(--space-4)">' +
      '<div class="card-head"><div><h2 class="sec">Respondentes</h2>' +
        '<span class="sub">Mostrando ' + PESSOAS.length + ' de ' + f.publicoTotal + ' pessoas do público-alvo.</span></div>' +
        botao('Exportar CSV', 'exportar', 'btn-neutral', { sm: true, icon: 'download' }) + '</div>' +
      '<table class="tbl"><thead><tr><th>Pessoa</th><th>Área</th><th>Unidade</th><th>Status</th><th class="acoes"></th></tr></thead><tbody>' +
      PESSOAS.map((p) => {
        const r = S.respondentes.find((x) => x.id === p.id);
        return '<tr class="clickable"' + (r ? ' data-act="ver-respondente" data-id="' + p.id + '"' : '') + '>' +
          '<td><div class="nome">' + esc(p.nome) + '</div>' + (r ? '<div class="sub">Respondeu em ' + esc(r.em) + '</div>' : '') + '</td>' +
          '<td>' + esc(p.area) + '</td><td>' + esc(p.unidade) + '</td>' +
          '<td>' + (r ? badge('Respondido', 'success') : badge('Pendente', 'warning')) + '</td>' +
          '<td class="acoes">' + (r ? ibtn('chevron-right', 'ver-respondente', 'Ver respostas', { id: p.id }) : '') + '</td></tr>';
      }).join('') + '</tbody></table>' +
    '</section>';

  return cabecalhoFormulario(f, 'respostas') +
  '<div style="margin-top:var(--space-4)">' + cabecalhoPct + '</div>' +
  privacidade +
  '<section class="card" style="margin-top:var(--space-4)">' +
    '<div class="card-head"><h2 class="sec">Resultados por pergunta</h2>' +
      '<span class="sub">' + lista.length + ' campos · sempre disponível, anônimo ou não</span></div>' +
    '<div class="card-body col" style="gap:var(--space-6)">' +
      lista.map((q, i) => '<div class="col" style="gap:8px">' +
        '<div class="row" style="gap:8px;align-items:flex-start">' +
          '<span class="chip">' + (i + 1) + '</span>' +
          '<div style="flex:1;min-width:0"><b style="font-size:var(--text-base);line-height:20px">' + esc(q.titulo) + '</b>' +
          (q.condicao ? '<div class="sub">' + ic('bolt', 13) + ' Só foi exibida para quem respondeu ' + esc(q.condicao.valor) + ' na pergunta gatilho.</div>' : '') + '</div>' +
          '<span class="chip">' + ic(tipoDe(q.tipo).icon, 14) + esc(tipoDe(q.tipo).nome) + '</span>' +
        '</div>' + barrasDaPergunta(q) + '</div>').join('') +
    '</div>' +
  '</section>' +
  tabela;
}

/* ===========================================================================
   Modais
   =========================================================================== */
function molde(titulo, eyebrow, corpo, rodape, classe) {
  return '<div class="backdrop" data-act="backdrop"><div class="modal ' + (classe || '') + '">' +
    '<div class="modal-head"><div style="min-width:0"><span class="eyebrow">' + esc(eyebrow) + '</span>' +
      '<h2>' + esc(titulo) + '</h2></div>' +
      '<button class="ibtn" data-act="fechar" aria-label="Fechar">' + ic('x', 18) + '</button></div>' +
    '<div class="modal-body">' + corpo + '</div>' +
    '<div class="modal-foot">' + rodape + '</div>' +
  '</div></div>';
}

function formNovo(s) {
  return { origem: 'zero', titulo: '', descricao: '', categoria: '', versao: '', pasta: '',
    codigo: 'FRM-2026-' + String(s.formularios.length + 1).padStart(3, '0'), responsaveis: ['u7'] };
}
function formDaPasta(s, id) {
  const p = s.pastas.find((x) => x.id === id);
  return p ? { id: p.id, nome: p.nome, descricao: p.descricao, acesso: p.acesso.slice() }
    : { id: '', nome: '', descricao: '', acesso: ['u7'] };
}
function formPublicacao(s, id) {
  const f = s.formularios.find((x) => x.id === id) || {};
  return { id: f.id, inicio: f.inicio || '', fim: f.fim || '', lembrete: !!f.lembrete,
    anonimo: !!f.anonimo, obrigatorio: !!f.obrigatorio, publico: (f.publico || []).slice(), aceite: false };
}

/* ---------- criar formulário ---------- */
function modalNovo() {
  const f = S.form;
  const codigoRepetido = S.formularios.some((x) => x.codigo.toLowerCase() === (f.codigo || '').trim().toLowerCase());
  const faltando = !f.titulo || !f.categoria || !(f.responsaveis || []).length || codigoRepetido;
  const origens = [{ id: 'zero', nome: 'Criar do zero', categoria: 'Formulário vazio', icon: 'plus' }].concat(MODELOS);

  const corpo =
  '<div class="col" style="gap:8px">' +
    '<span class="caps">Origem</span>' +
    '<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">' +
      origens.map((o) => '<button class="ptype" style="flex-direction:column;align-items:flex-start;gap:6px;padding:12px' +
        (f.origem === o.id ? ';border-color:var(--magenta);background:var(--magenta-08)' : '') + '" data-act="origem" data-v="' + o.id + '">' +
        ic(o.icon, 18, f.origem === o.id ? 'var(--magenta)' : 'var(--ink-muted)') +
        '<span style="font-weight:600">' + esc(o.nome) + '</span>' +
        '<span class="sub">' + esc(o.categoria) + (o.campos ? ' · ' + o.campos + ' campos' : '') + '</span></button>').join('') +
    '</div>' +
    '<span class="sub">O modelo é ponto de partida, não trilho: campos e configurações vêm pré-carregados e podem ser editados livremente.</span>' +
  '</div>' +
  '<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">' +
    '<div style="grid-column:1/-1">' + campo('Título', '<input class="inp" data-act="f-edit" data-k="titulo" data-live="1" value="' + esc(f.titulo) + '" placeholder="Ex.: Conflito de Interesses 2026">', { req: true }) + '</div>' +
    '<div style="grid-column:1/-1">' + campo('Descrição', '<textarea class="inp" data-act="f-edit" data-k="descricao" data-live="1" rows="2" placeholder="Texto livre — aparece para o colaborador no Portal">' + esc(f.descricao) + '</textarea>') + '</div>' +
    campo('Categoria', '<div class="inp-wrap sel">' + ic('chevron-down', 16) + '<select class="inp" data-act="f-edit" data-k="categoria">' +
      '<option value="">Escolha uma categoria</option>' +
      S.categorias.map((c) => '<option value="' + c.id + '"' + (f.categoria === c.id ? ' selected' : '') + '>' + esc(c.nome) + '</option>').join('') +
      '</select></div>', { req: true, hint: 'Lista mantida na aba Ajustes.' }) +
    campo('Versão', '<input class="inp" data-act="f-edit" data-k="versao" data-live="1" value="' + esc(f.versao) + '" placeholder="Ex.: v1">', { hint: 'Texto livre, preenchido manualmente.' }) +
    campo('Pasta', '<div class="inp-wrap sel">' + ic('chevron-down', 16) + '<select class="inp" data-act="f-edit" data-k="pasta">' +
      '<option value="">Sem pasta</option>' +
      S.pastas.map((p) => '<option value="' + p.id + '"' + (f.pasta === p.id ? ' selected' : '') + '>' + esc(p.nome) + '</option>').join('') +
      '<option value="__nova">+ Criar nova pasta</option></select></div>',
      { hint: 'Fora de pasta o formulário não tem grupo de acesso pré-definido.' }) +
    campo('Código do formulário', '<input class="inp" data-act="f-edit" data-k="codigo" data-live="1" value="' + esc(f.codigo) + '">',
      { hint: codigoRepetido ? '<span style="color:var(--danger-text);font-weight:600">Já existe um formulário com este código. Altere para seguir.</span>' : 'Gerado automaticamente, único em todo o sistema, editável.' }) +
    '<div style="grid-column:1/-1">' + campo('Responsáveis',
      '<div class="row" style="flex-wrap:wrap;gap:6px">' + PESSOAS.concat(GRUPOS.map((g) => ({ id: g.id, nome: g.nome }))).map((p) =>
        '<button class="chip' + ((f.responsaveis || []).indexOf(p.id) >= 0 ? ' on' : '') + '" data-act="f-responsavel" data-v="' + p.id + '">' +
        ic(p.id[0] === 'g' ? 'users' : 'user', 13) + esc(p.nome) + '</button>').join('') + '</div>',
      { req: true, hint: 'Responsáveis têm as mesmas permissões do criador: editar, publicar e excluir.' }) + '</div>' +
  '</div>' +

    ? alerta('warning', 'Isso concede acesso ao módulo',

      esc((f.responsaveis || []).filter((x) => x !== 'u7').map((id) => (id[0] === 'g' ? grupo(id).nome : pessoa(id).nome)).join(', ')) +

  '<div class="row" style="gap:var(--space-4);flex-wrap:wrap">' +

    '<span class="sub">' + ic('photo', 14) + ' O logo do Grupo Aurora entra no topo do formulário e na exportação em PDF, vindo de Informações da Empresa.</span>' +
  '</div>';

  const rodape = botao('Criar e construir perguntas', 'criar-formulario', 'btn-primary', { disabled: faltando, icon: 'arrow-right' }) +
    botao('Cancelar', 'fechar', 'btn-ghost');
  return molde('Novo formulário', 'Formulários', corpo, rodape, 'wide');
}

/* ---------- pasta ---------- */
function modalPasta() {
  const f = S.form;
  const dentro = f.id ? formsDaPasta(f.id) : 0;
  const corpo =
  campo('Nome da pasta', '<input class="inp" data-act="f-edit" data-k="nome" data-live="1" value="' + esc(f.nome) + '" placeholder="Ex.: Compliance Anual">', { req: true }) +
  campo('Descrição', '<textarea class="inp" data-act="f-edit" data-k="descricao" data-live="1" rows="2">' + esc(f.descricao) + '</textarea>') +
  '<div class="field"><label>Quem tem acesso</label>' +
    '<div class="row" style="flex-wrap:wrap;gap:6px">' + PESSOAS.map((p) =>
      '<button class="chip' + ((f.acesso || []).indexOf(p.id) >= 0 ? ' on' : '') + '" data-act="f-acesso" data-v="' + p.id + '">' +
      ic('user', 13) + esc(p.nome) + '</button>').join('') + '</div>' +
    '<span class="hint">Por padrão só quem criou a pasta tem acesso. O acesso é binário: quem entra aqui pode fazer qualquer ação nos formulários da pasta — e é adicional ao acesso ao módulo, não substitui.</span></div>' +
  (f.id ? (dentro
    ? alerta('warning', 'Pasta com ' + dentro + (dentro === 1 ? ' formulário' : ' formulários'),
      'Pasta com formulário dentro não pode ser excluída. Mova ou exclua os formulários primeiro — aqui a ação é barrada, não adiada.', 'alert-triangle')
    : alerta('info', 'Pasta vazia', 'Pode ser excluída agora, sem passar pela Lixeira.', 'info-circle')) : '') +
  alerta('info', 'Pasta não chega ao Portal',
    'Pasta é organização interna da plataforma Sincera. O que leva um formulário ao colaborador é a publicação com público-alvo — nunca a pasta.', 'world');

  const rodape = botao(f.id ? 'Salvar pasta' : 'Criar pasta', 'salvar-pasta', 'btn-primary', { disabled: !f.nome }) +
    botao('Cancelar', 'fechar', 'btn-ghost') +
    (f.id && !dentro ? '<span class="grow"></span>' + botao('Excluir pasta', 'excluir-pasta', 'btn-ghost', { id: f.id, icon: 'trash' }) : '');
  return molde(f.id ? 'Editar pasta' : 'Nova pasta', 'Pastas', corpo, rodape);
}

/* ---------- categoria ---------- */
function modalCategoria() {
  const f = S.form;
  const corpo =
    campo('Nome da categoria', '<input class="inp" data-act="f-edit" data-k="nome" data-live="1" value="' + esc(f.nome || '') + '" placeholder="Ex.: Ética e Conduta">', { req: true }) +
    campo('Descrição', '<input class="inp" data-act="f-edit" data-k="descricao" data-live="1" value="' + esc(f.descricao || '') + '">') +
    alerta('info', 'Campo obrigatório do formulário', 'Todo formulário precisa de uma categoria. Por isso uma categoria em uso não pode ser excluída — troque antes a categoria dos formulários que a usam.', 'tag');
  const rodape = botao(f.id ? 'Salvar categoria' : 'Criar categoria', 'salvar-categoria', 'btn-primary', { disabled: !f.nome }) +
    botao('Cancelar', 'fechar', 'btn-ghost');
  return molde(f.id ? 'Editar categoria' : 'Nova categoria', 'Ajustes', corpo, rodape);
}

        { icon: 'mail', titulo: 'E-mail de publicação', detalhe: 'A publicação dispara e-mail transacional para todos os destinatários.' },
        { icon: 'clock', titulo: 'Sair do público-alvo tira o acesso',
          detalhe: 'Com exceção de sessão aberta: se estiver na tela do colaborador, some ao fechar, salvar ou atualizar.' },
      ]) +
    '</div>' +
  '</div>';

  const corpo = '<div class="grid" style="grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start">' + esquerda + direita + '</div>' +
    '<label class="check" style="padding-top:var(--space-2);border-top:1px solid var(--stone)">' +
      '<input type="checkbox" data-act="pub-aceite"' + (f.aceite ? ' checked' : '') + '>' +
      '<span style="font-size:var(--text-13);line-height:18px">Entendi que o formulário fica visível no Portal para o público-alvo selecionado e que um e-mail será disparado agora.</span></label>';

  const rodape = botao('Sim, publicar agora', 'confirmar-publicacao', 'btn-primary', { disabled: !f.aceite || semPublico, icon: 'send' }) +
    botao('Cancelar', 'fechar', 'btn-ghost') +
    (alvo.status === 'publicado' || alvo.status === 'vencido'
      ? '<span class="grow"></span>' + botao('Despublicar', 'despublicar', 'btn-ghost', { id: alvo.id, icon: 'eye-off' }) : '');
  return molde('Publicar formulário', esc(alvo.codigo || 'Formulários'), corpo, rodape, 'xwide');
}

function opcaoPub(titulo, texto, ligado, act, desabilitado, nota) {
  return '<div class="row" style="align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--stone);border-radius:var(--radius-sm)' +
    (desabilitado ? ';opacity:.6' : '') + '">' +
    '<div style="flex:1;min-width:0"><b style="font-size:var(--text-13);font-weight:600">' + esc(titulo) + '</b>' +
    '<div class="sub">' + esc(texto) + '</div>' +
    (nota ? '<div class="sub" style="margin-top:4px;color:var(--warning-text)">' + esc(nota) + '</div>' : '') + '</div>' +
    switchBtn(ligado, act, { disabled: desabilitado, label: titulo }) + '</div>';
}

/* ---------- detalhe do respondente ---------- */
function modalRespondente() {
  const p = pessoa(S.respondente);
  const f = formAtivo();
  const r = S.respondentes.find((x) => x.id === S.respondente) || {};
  const respostasMock = {
    'sim-nao': 'Não', 'texto-curto': 'Aurora Log Transportes Ltda.', 'texto-longo': 'Consultoria pontual, 4 horas semanais, sem relação com fornecedores do grupo.',
    'selecao-unica': 'Familiar até 2º grau', 'multipla': 'Nenhuma das anteriores', 'data': '14/03/2026',
    'moeda': 'R$ 0,00', 'numero': '0', 'documento': '384.221.906-77', 'upload': 'declaracao-societaria.pdf', 'intervalo': '01/01/2026 – 31/12/2026',
    'declaracao': 'Declarado em ' + (r.em || ''),
  };
  const lista = perguntasDe(f.id).filter((q) => !q.condicao);
  const corpo =
    '<div class="row" style="gap:10px">' +
      '<span class="badge b-brand nodot" style="width:36px;height:36px;justify-content:center;border-radius:var(--radius-full)">' +
      esc(p.nome.split(' ').map((x) => x[0]).slice(0, 2).join('')) + '</span>' +
      '<div><b style="font-size:var(--text-base)">' + esc(p.nome) + '</b>' +
      '<div class="sub">' + esc(p.area) + ' · ' + esc(p.unidade) + ' · respondeu em ' + esc(r.em || '') + '</div></div></div>' +
    '<div class="col" style="gap:var(--space-4)">' +
      lista.map((q) => '<div class="col" style="gap:2px">' +
        '<span class="sub">' + esc(q.titulo) + '</span>' +
        '<b style="font-size:var(--text-13);font-weight:500">' + esc(respostasMock[q.tipo] || '—') + '</b></div>').join('') +
    '</div>' +
    alerta('info', 'Só existe em formulário identificado', 'Em formulário com resposta anônima esta tela não existe: sem tabela de respondentes e sem detalhe individual.', 'lock');
  return molde(p.nome, 'Respostas · ' + f.codigo, corpo, botao('Fechar', 'fechar', 'btn-neutral'), 'wide');
}

/* ---------- confirmação genérica ---------- */
function modalConfirmar() {
  const c = S.form;
  const corpo = '<p style="margin:0;font-size:var(--text-base);line-height:20px">' + esc(c.texto) + '</p>' +
    (c.nota ? '<p class="sub" style="margin:0">' + esc(c.nota) + '</p>' : '') +
    (c.alerta ? alerta(c.alertaTone || 'warning', c.alertaTitulo, esc(c.alerta), 'alert-triangle') : '');
  const rodape = (c.bloqueado ? '' : botao(c.confirmar || 'Confirmar', 'confirmar-acao', c.variante || 'btn-primary')) +
    botao(c.bloqueado ? 'Entendi' : 'Cancelar', 'fechar', c.bloqueado ? 'btn-neutral' : 'btn-ghost');
  return molde(c.titulo, c.eyebrow || 'Formulários', corpo, rodape);
}

function modalAtual() {
  switch (S.modal) {
    case 'novo': return modalNovo();
    case 'pasta': return modalPasta();
    case 'categoria': return modalCategoria();
    case 'publicar': return modalPublicar();
    case 'previa': return modalPrevia();
    case 'respondente': return modalRespondente();
    case 'confirmar': return modalConfirmar();
    default: return '';
  }
}

function novaPergunta(tipo) {
  const t = tipoDe(tipo);
  return { id: novoId('q'), tipo: tipo, titulo: t.nome + ' sem título', descricao: '', obrigatorio: false,
    opcoes: t.opcoes ? ['Opção 1', 'Opção 2'] : [], condicao: null };
}

function limparCondicoesDe(fid, gid) {
  perguntasDe(fid).forEach((q) => { if (q.condicao && q.condicao.gatilho === gid) q.condicao = null; });
}

function perguntaSel() { return perguntasDe(S.alvo).find((q) => q.id === S.sel); }

function confirmar(cfg) { S.modal = 'confirmar'; S.form = cfg; render(); }

      descricao: '', responsaveis: ['u7'], obrigatorio: false, anonimo: false, lembrete: false, inicio: '', fim: '', publico: [], publicoTotal: 0, respostas: 0 },
      { id: f.id, codigo: f.codigo, titulo: f.titulo, categoria: f.categoria }));
    S.perguntas[f.id] = S.perguntas[f.id] || [];
    notificar('Formulário restaurado', f.titulo + ' voltou como rascunho.', 'arrow-back-up');
    render();
  },

  /* ----- pastas ----- */
  'nova-pasta': () => abrirModal('pasta', { id: '', nome: '', descricao: '', acesso: ['u7'] }, 'criar-organizar-pastas'),
  'editar-pasta': (v, el) => abrirModal('pasta', formDaPasta(S, el.dataset.id), 'criar-organizar-pastas'),
  'f-acesso': (v) => {
    const a = S.form.acesso || [];
    S.form.acesso = a.indexOf(v) >= 0 ? a.filter((x) => x !== v) : a.concat([v]);
    render();
  },
  'salvar-pasta': () => {
    const f = S.form;
    if (f.id) {
      const p = S.pastas.find((x) => x.id === f.id);
      Object.assign(p, { nome: f.nome, descricao: f.descricao, acesso: f.acesso });
      notificar('Pasta atualizada', f.acesso.length + ' pessoas têm acesso a ' + f.nome + '.', 'folder');
    } else {
      S.pastas.push({ id: novoId('p'), nome: f.nome, descricao: f.descricao, acesso: f.acesso });
      notificar('Pasta criada', 'Só quem está na lista de acesso enxerga os formulários de ' + f.nome + '.', 'folder');
    }
    fecharModal();
  },
  'excluir-pasta': (v, el) => {
    const id = el.dataset.id;
    const n = formsDaPasta(id);
    if (n) {
      confirmar({ eyebrow: 'Pastas', titulo: 'Não dá para excluir esta pasta', bloqueado: true,
        texto: pastaNome(id) + ' tem ' + n + (n === 1 ? ' formulário dentro.' : ' formulários dentro.'),
        nota: 'Mova ou exclua os formulários primeiro. Diferente do formulário, que vai para a Lixeira, aqui a ação é barrada e não fica pendente.' });
      return;
    }
    confirmar({ eyebrow: 'Pastas', titulo: 'Excluir pasta', alvo: id, acao: 'excluir-pasta',
      texto: 'Excluir a pasta ' + pastaNome(id) + '?', nota: 'A pasta está vazia — nada vai para a Lixeira.',
      confirmar: 'Excluir', variante: 'btn-danger' });
  },

  /* ----- categorias ----- */
  'nova-categoria': () => abrirModal('categoria', { id: '', nome: '', descricao: '' }, 'gerenciar-categorias'),
  'editar-categoria': (v, el) => {
    const c = S.categorias.find((x) => x.id === el.dataset.id);
    abrirModal('categoria', { id: c.id, nome: c.nome, descricao: c.descricao }, 'gerenciar-categorias');
  },
  'salvar-categoria': () => {
    const f = S.form;
    if (f.id) { Object.assign(S.categorias.find((x) => x.id === f.id), { nome: f.nome, descricao: f.descricao }); notificar('Categoria atualizada', f.nome + ' foi salva.', 'tag'); }
    else { S.categorias.push({ id: novoId('c'), nome: f.nome, descricao: f.descricao }); notificar('Categoria criada', f.nome + ' já aparece no formulário e na busca.', 'tag'); }
    fecharModal();
  },
  'excluir-categoria': (v, el) => {
    const id = el.dataset.id;
    const n = usosDaCategoria(id);
    if (n) {
      confirmar({ eyebrow: 'Ajustes', titulo: 'Categoria em uso', bloqueado: true,
        texto: catNome(id) + ' está em ' + n + (n === 1 ? ' formulário.' : ' formulários.'),
        nota: 'Troque antes a categoria desses formulários. Como categoria é campo obrigatório, não pode existir formulário sem ela — por isso a exclusão é barrada, não adiada.' });
      return;
    }
    confirmar({ eyebrow: 'Ajustes', titulo: 'Excluir categoria', alvo: id, acao: 'excluir-categoria',
      texto: 'Excluir a categoria ' + catNome(id) + '?', nota: 'Nenhum formulário usa esta categoria.', confirmar: 'Excluir', variante: 'btn-danger' });
  },

  /* ----- publicação ----- */
  publicar: (v, el) => {
    const id = el.dataset.id || S.alvo;
    S.alvo = id; S.view = 'construtor'; S.sel = null;
    abrirModal('publicar', formPublicacao(S, id), 'publicar-formulario');
  },
  'pub-lembrete': () => { if (!S.form.anonimo) { S.form.lembrete = !S.form.lembrete; render(); } },
  'pub-anonimo': () => { if (!S.form.lembrete) { S.form.anonimo = !S.form.anonimo; render(); } },
  'pub-obrigatorio': () => { S.form.obrigatorio = !S.form.obrigatorio; render(); },
  'pub-alvo': (v) => {
    const p = S.form.publico || [];
    S.form.publico = p.indexOf(v) >= 0 ? p.filter((x) => x !== v) : p.concat([v]);
    render();
  },
  'pub-aceite': (v, el) => { S.form.aceite = el.checked; render(); },
  'confirmar-publicacao': () => {
    const f = S.form;
    const alvo = S.formularios.find((x) => x.id === f.id);
    const total = f.publico.reduce((a, id) => a + (id[0] === 'g' ? grupo(id).membros : 1), 0);
    Object.assign(alvo, { status: 'publicado', inicio: f.inicio, fim: f.fim, lembrete: f.lembrete,
      anonimo: f.anonimo, obrigatorio: f.obrigatorio, publico: f.publico, publicoTotal: total, atualizadoEm: '02/08/2026' });
    notificar('Formulário publicado', total + ' pessoas passam a ver ' + alvo.titulo + ' no Portal e recebem o e-mail agora.', 'send');
    fecharModal();
  },
  despublicar: (v, el) => {
    const f = S.formularios.find((x) => x.id === (el.dataset.id || S.alvo));
    f.status = 'despublicado';
    notificar('Formulário despublicado', f.titulo + ' saiu do Portal. Continua na plataforma e pode ser republicado.', 'eye-off');
    if (S.modal) fecharModal(); else render();
  },
  exportar: () => notificar('Exportação', 'CSV com respondentes e respostas gerado. Em formulário anônimo a exportação sai sem identificação.', 'download'),
  previa: () => abrirModal('previa', {}),
  'ver-respondente': (v, el) => { S.respondente = el.dataset.id; abrirModal('respondente', {}); },

  /* ----- construtor ----- */
  'sel-campo': (v, el) => { S.sel = el.dataset.id; render(); },
  'add-campo': (v) => {
    const q = novaPergunta(v);
    perguntasDe(S.alvo).push(q);
    S.sel = q.id; marcarEdicao(); render();
  },
  'dup-campo': (v, el) => {
    const lista = perguntasDe(S.alvo);
    const i = lista.findIndex((q) => q.id === el.dataset.id);
    const copia = Object.assign(JSON.parse(JSON.stringify(lista[i])), { id: novoId('q') });
    lista.splice(i + 1, 0, copia);
    S.sel = copia.id; marcarEdicao(); render();
  },
  'del-campo': (v, el) => {
    const lista = perguntasDe(S.alvo);
    const i = lista.findIndex((q) => q.id === el.dataset.id);
    const id = lista[i].id;
    lista.splice(i, 1);
    limparCondicoesDe(S.alvo, id);
    if (S.sel === id) S.sel = null;
    marcarEdicao(); render();
  },
  'q-obrigatorio': () => { const q = perguntaSel(); q.obrigatorio = !q.obrigatorio; marcarEdicao(); render(); },
  'q-condicao': () => {
    const q = perguntaSel();
    if (q.condicao) q.condicao = null;
    else {
      const g = gatilhosDisponiveis(S.alvo, q.id)[0];
      if (!g) return;
      q.condicao = { gatilho: g.id, valor: valoresDoGatilho(S.alvo, g.id)[0] };
    }
    marcarEdicao(); render();
  },
  'q-gatilho': (v, el) => { const q = perguntaSel(); q.condicao = { gatilho: el.value, valor: valoresDoGatilho(S.alvo, el.value)[0] }; marcarEdicao(); render(); },
  'q-valor': (v, el) => { perguntaSel().condicao.valor = el.value; marcarEdicao(); render(); },
  'q-opcao': (v, el) => { perguntaSel().opcoes[Number(el.dataset.i)] = el.value; marcarEdicao(); renderComFoco(); },
  'add-opcao': () => { const q = perguntaSel(); q.opcoes.push('Opção ' + (q.opcoes.length + 1)); marcarEdicao(); render(); },
  'del-opcao': (v) => { const q = perguntaSel(); q.opcoes.splice(Number(v), 1); marcarEdicao(); render(); },
  'q-edit': (v, el) => { perguntaSel()[el.dataset.k] = el.value; marcarEdicao(); renderComFoco(); },

  /* ----- genéricos ----- */
  'f-edit': (v, el) => {
    const k = el.dataset.k;
    if (k === 'pasta' && el.value === '__nova') { S.form.pasta = ''; S.form.novaPastaNome = ''; render(); return; }
    S.form[k] = el.value;
    if (el.tagName === 'SELECT') render(); else renderComFoco();
  },
  'confirmar-acao': () => {
    const c = S.form;
    if (c.acao === 'excluir-form') {
      const i = S.formularios.findIndex((x) => x.id === c.alvo);
      const f = S.formularios[i];
      S.formularios.splice(i, 1);
      S.lixeira.push({ id: f.id, codigo: f.codigo, titulo: f.titulo, categoria: f.categoria, excluidoEm: '02/08/2026', restamDias: 30 });
      notificar('Formulário excluído', f.titulo + ' fica restaurável na Lixeira por 30 dias.', 'trash');
    } else if (c.acao === 'excluir-pasta') {
      S.pastas = S.pastas.filter((x) => x.id !== c.alvo);
      if (S.rail === c.alvo) S.rail = 'todas';
      notificar('Pasta excluída', 'A pasta estava vazia e saiu na hora.', 'trash');
    } else if (c.acao === 'excluir-categoria') {
      S.categorias = S.categorias.filter((x) => x.id !== c.alvo);
      notificar('Categoria excluída', 'Nenhum formulário usava esta categoria.', 'trash');
    }
    fecharModal();
  },
  fechar: () => fecharModal(),
};

/* ---------- render ---------- */
function corpoDaView() {
  switch (S.view) {
    case 'painel': return viewPainel();
    case 'ajustes': return viewAjustes();
    case 'construtor': return viewConstrutor();
    case 'respostas': return viewRespostas();
    default: return viewResumo();
  }
}
function render() {
  const migalha = (S.view === 'construtor' || S.view === 'respostas') && formAtivo() ? formAtivo().titulo : '';
  document.getElementById('app').innerHTML = shell(corpoDaView(), { migalha: migalha });
}
/* re-render preservando foco e cursor — deixa o construtor responder a cada tecla */
function renderComFoco() {
  const a = document.activeElement;
  const chave = a && a.dataset && a.dataset.act
    ? '[data-act="' + a.dataset.act + '"]' + (a.dataset.k ? '[data-k="' + a.dataset.k + '"]' : '') + (a.dataset.i ? '[data-i="' + a.dataset.i + '"]' : '')
    : null;
  const pos = a && a.selectionStart;
  render();
  if (!chave) return;
  const n = document.querySelector(chave);
  if (!n) return;
  n.focus();
  try { n.setSelectionRange(pos, pos); } catch (e) { /* input sem seleção */ }
}

/* ---------- eventos ---------- */
document.addEventListener('click', (e) => {
  const alvo = e.target.closest('[data-act]');
  if (!alvo) return;
  const act = alvo.dataset.act;
  if (act === 'backdrop') { if (e.target === alvo) fecharModal(); return; }
  if (['busca', 'status', 'f-edit', 'q-edit', 'q-opcao', 'q-gatilho', 'q-valor', 'pub-aceite'].indexOf(act) >= 0) return;
  const fn = ACOES[act];
  if (!fn) return;
  e.preventDefault();
  fn(alvo.dataset.v, alvo);
});
document.addEventListener('input', (e) => {
  const alvo = e.target.closest('[data-act]');
  if (!alvo || !alvo.dataset.live) return;
  const fn = ACOES[alvo.dataset.act];
  if (fn) fn(alvo.dataset.v, alvo);
});
document.addEventListener('change', (e) => {
  const alvo = e.target.closest('[data-act]');
  if (!alvo || alvo.dataset.live) return;
  const fn = ACOES[alvo.dataset.act];
  if (fn && (alvo.tagName === 'SELECT' || alvo.type === 'checkbox')) fn(alvo.dataset.v, alvo);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modal) fecharModal(); });
window.addEventListener('hashchange', () => { const h = doHash(); if (h && h !== hashDaView()) irParaEstado(h); });

/* ---------- drag and drop do construtor ---------- */
let arrastando = null;
document.addEventListener('dragstart', (e) => {
  const t = e.target.closest('[data-drag-tipo]');
  const q = e.target.closest('[data-drag-q]');
  if (t) arrastando = { tipo: t.dataset.dragTipo };
  else if (q) { arrastando = { id: q.dataset.dragQ }; q.classList.add('drag'); }
  else return;
  try { e.dataTransfer.setData('text/plain', 'x'); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* ok */ }
});
document.addEventListener('dragend', () => {
  arrastando = null;
  document.querySelectorAll('.qcard.drag').forEach((n) => n.classList.remove('drag'));
  document.querySelectorAll('.drop.over').forEach((n) => n.classList.remove('over'));
});
document.addEventListener('dragover', (e) => {
  const d = e.target.closest('.drop');
  if (!d || !arrastando) return;
  e.preventDefault();
  document.querySelectorAll('.drop.over').forEach((n) => { if (n !== d) n.classList.remove('over'); });
  d.classList.add('over');
});
document.addEventListener('dragleave', (e) => {
  const d = e.target.closest('.drop');
  if (d) d.classList.remove('over');
});
document.addEventListener('drop', (e) => {
  const d = e.target.closest('.drop');
  if (!d || !arrastando) return;
  e.preventDefault();
  const i = Number(d.dataset.drop);
  const lista = perguntasDe(S.alvo);
  if (arrastando.tipo) {
    const q = novaPergunta(arrastando.tipo);
    lista.splice(i, 0, q);
    S.sel = q.id;
  } else {
    const at = lista.findIndex((x) => x.id === arrastando.id);
    if (at >= 0) {
      const q = lista.splice(at, 1)[0];
      lista.splice(at < i ? i - 1 : i, 0, q);
      S.sel = q.id;
    }
  }
  arrastando = null;
  marcarEdicao();
  render();
});

/* ---------- boot ---------- */
function iniciar() {
  const h = doHash();
  if (h) {
    const e = ESTADOS[h];
    S.view = e.view;
    if (e.aplica) e.aplica(S);
  }
  render();
}
S = estadoInicial();
iniciar();

</script>
</body>
</html>
